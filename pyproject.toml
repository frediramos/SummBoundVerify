[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
summboundverify = [
    "api/*.c",
    "api/*.h",
    "utils/fake_libc_include/**/*",
    "validation_tool/fuzzing/afl/*.c",
    "validation_tool/fuzzing/afl/*.h",
]

[project]
name = "summboundverify"
version = "0.1.0"
description = "Validate symbolic summaries for C using angr"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = ["angr[unicorn]==9.2.203", "autopep8>=2.3.2", "pycparser~=3.0", "pyyaml>=6.0"]

[project.scripts]
summbv = "summboundverify.main:main"
